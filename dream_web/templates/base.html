<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Analyzer - Анализ снов</title>
    <style>
    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        margin: 0; 
        padding: 0; 
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
    }
    .container { 
        max-width: 500px; 
        margin: 0 auto; 
        padding: 20px; 
    }
    .header { 
        background: white; 
        padding: 30px; 
        border-radius: 15px; 
        margin-bottom: 20px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
    }
    .card { 
        background: white; 
        padding: 30px; 
        border-radius: 15px; 
        margin-bottom: 20px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        max-width: 100%;
        box-sizing: border-box;
    }
    .btn { 
        background: #667eea; 
        color: white; 
        padding: 12px 0; 
        border: none; 
        border-radius: 8px; 
        cursor: pointer; 
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        width: 100%;
        margin-top: 10px;
    }
    .btn:hover {
        background: #5a6fd8;
    }
    label { 
        display: block; 
        margin-bottom: 8px; 
        font-weight: 600;
        color: #333;
    }
    input[type="text"], 
    input[type="email"], 
    input[type="password"] {
        width: 100%;
        padding: 12px;
        border: 2px solid #e1e5e9;
        border-radius: 8px;
        font-size: 16px;
        box-sizing: border-box;
    }
    input:focus {
        border-color: #667eea;
        outline: none;
    }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
